<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>
        Real ou IA?
    </title>
</head>
<body>

    <div id="quiz" class="container-fluid min-vh-100 d-flex flex-column justify-content-center align-items-center bg-light">
        <h1>
            IA ou Não?
        </h1>
        <div id="image-container"></div>
        <div id="question"></div>
        <div id="option"></div>
        <div id="feedback" class="mt-3 text-center"></div>
    </div>

    <div id="zoom-modal" onclick="this.style.display='none'" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:999; justify-content:center; align-items:center; cursor:zoom-out;">
        <img id="zoom-img" style="max-width:92%; max-height:90%; border-radius:8px;">
    </div>

    <script src="index.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
